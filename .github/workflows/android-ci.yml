name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4

      - name: Create temporary debug signing key
        run: |
          keytool -genkeypair -keystore debug.keystore -storepass android \
            -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 3650 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build, test and lint
        run: ./gradlew --no-daemon --continue :app:assembleDebug :app:testDebugUnitTest :render-engine:testDebugUnitTest :app:lintDebug :render-engine:lintDebug

      - name: Upload debug APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: depthlive-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload test and lint reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-test-and-lint-reports
          path: |
            app/build/reports/
            render-engine/build/reports/
          if-no-files-found: ignore
          retention-days: 7

  startup-smoke:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: depthlive-debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb install apk/*.apk
            adb logcat -c
            adb shell am start -W -n com.aistudio.depthlive.vwpqzx/com.example.MainActivity
            sleep 5
            adb logcat -d -v threadtime -s AndroidRuntime:E libc:F GlShaderUtils:E WallpaperRepository:D SegmentationEngine:E > startup-logcat.txt
            sleep 60
            adb logcat -b crash -d -v threadtime >> startup-logcat.txt
            adb shell pidof com.aistudio.depthlive.vwpqzx
      - name: Upload startup log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: startup-logcat
          path: startup-logcat.txt
          if-no-files-found: ignore
          retention-days: 7
